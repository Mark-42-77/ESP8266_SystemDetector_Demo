<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能温控 - PC端</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      padding: 40px;
      color: #fff;
    }
    .container { max-width: 1100px; margin: 0 auto; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }
    .header h1 { font-size: 32px; font-weight: 700; }
    .time-bar {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 8px;
      font-family: "Cascadia Code", "Fira Code", monospace;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.1);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
    }
    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #ef4444;
      transition: background 0.3s;
    }
    .status-dot.online { background: #22c55e; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 36px 32px;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .card-icon { font-size: 32px; }
    .card-title { font-size: 16px; opacity: 0.7; }
    .card-value { font-size: 64px; font-weight: 700; line-height: 1; }
    .card-unit  { font-size: 24px; font-weight: 400; opacity: 0.6; margin-left: 8px; }

    .card.temp { border-top: 4px solid #f97316; }
    .card.humi { border-top: 4px solid #06b6d4; }
    .card.light { border-top: 4px solid #a855f7; }

    .fan-section {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 36px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .fan-info { display: flex; align-items: center; gap: 16px; }
    .fan-icon { font-size: 40px; }
    .fan-label { font-size: 20px; font-weight: 600; }
    .fan-status { font-size: 14px; opacity: 0.6; margin-top: 4px; }

    .fan-switch {
      position: relative;
      width: 80px; height: 40px;
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .fan-switch.on { background: #22c55e; }
    .fan-switch::after {
      content: '';
      position: absolute;
      top: 4px; left: 4px;
      width: 32px; height: 32px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.3s;
    }
    .fan-switch.on::after { transform: translateX(40px); }

    .log-section {
      margin-top: 24px;
      background: rgba(0,0,0,0.3);
      border-radius: 16px;
      padding: 24px;
    }
    .log-title { font-size: 14px; opacity: 0.6; margin-bottom: 12px; }
    .log-list {
      max-height: 180px;
      overflow-y: auto;
      font-family: "Cascadia Code", "Fira Code", monospace;
      font-size: 13px;
      line-height: 1.8;
      opacity: 0.8;
    }
    .log-entry { border-bottom: 1px solid rgba(255,255,255,0.05); padding: 4px 0; }
    .log-time { color: #60a5fa; }

    .footer {
      text-align: center;
      margin-top: 40px;
      font-size: 12px;
      opacity: 0.4;
    }

    @media (max-width: 768px) {
      body { padding: 20px; }
      .grid { grid-template-columns: 1fr; }
      .card-value { font-size: 48px; }
    }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <h1>智能温控系统</h1>
      <div class="time-bar" id="timeDisplay"></div>
    </div>
    <div class="status-badge">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">未连接</span>
    </div>
  </div>

  <div class="grid">
    <div class="card temp">
      <div class="card-header">
        <span class="card-icon">🌡️</span>
        <span class="card-title">实时温度</span>
      </div>
      <div class="card-value"><span id="tempValue">--</span><span class="card-unit">°C</span></div>
    </div>
    <div class="card humi">
      <div class="card-header">
        <span class="card-icon">💧</span>
        <span class="card-title">实时湿度</span>
      </div>
      <div class="card-value"><span id="humiValue">--</span><span class="card-unit">%</span></div>
    </div>
    <div class="card light">
      <div class="card-header">
        <span class="card-icon">💡</span>
        <span class="card-title">光照强度</span>
      </div>
      <div class="card-value"><span id="lightValue">--</span><span class="card-unit">%</span></div>
      <div style="font-size:14px; opacity:0.7; margin-top:6px;"><span id="lightLux">--</span> lx</div>
    </div>
    <div class="card" style="border-top: 4px solid #22c55e;">
      <div class="card-header">
        <span class="card-icon">👤</span>
        <span class="card-title">人体存在</span>
      </div>
      <div class="card-value" id="presenceValue" style="font-size:48px;">--</div>
    </div>
  </div>

  <div class="grid">
    <div class="fan-section">
      <div class="fan-info">
        <span class="fan-icon">💨</span>
        <div>
          <div class="fan-label">风扇</div>
          <div class="fan-status" id="fan1StatusText">当前状态：关闭</div>
        </div>
      </div>
      <div class="fan-switch" id="fan1Switch" onclick="toggleFan(1)"></div>
    </div>
    <div class="fan-section">
      <div class="fan-info">
        <span class="fan-icon">💧</span>
        <div>
          <div class="fan-label">加湿器</div>
          <div class="fan-status" id="fan2StatusText">当前状态：关闭</div>
        </div>
      </div>
      <div class="fan-switch" id="fan2Switch" onclick="toggleFan(2)"></div>
    </div>
  </div>

  <div class="fan-section" style="margin-top: 0;">
    <div class="fan-info">
      <span class="fan-icon">🔊</span>
      <div>
        <div class="fan-label">蜂鸣器</div>
        <div class="fan-status" id="muteStatusText">当前状态：关闭</div>
      </div>
    </div>
    <div class="fan-switch" id="muteSwitch" onclick="toggleMute()"></div>
  </div>

  <div class="log-section">
    <div class="log-title">数据日志</div>
    <div class="log-list" id="logList">
      <div class="log-entry" style="opacity:0.5;">等待数据...</div>
    </div>
  </div>

  <div class="footer">巴法云 · ESP8266 · 数据每 5 秒自动刷新</div>

</div>

<!-- MQTT.js CDN -->
<script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
<script>
  // ========== 巴法云配置 ==========
  const BROKER_URL = 'wss://bemfa.com:9504/wss';
  const BEMFA_KEY  = 'ff2aba976550475080b2c399fad134a0';
  const TOPIC_TEMP = 'temp004';   // 温湿度（小爱查询）
  const TOPIC_DATA = 'data004';   // 光照+设备状态
  const TOPIC_FAN1 = 'fan003';
  const TOPIC_FAN2 = 'humi006';
  const TOPIC_MUTE = 'mute006';

  // ========== 状态 ==========
  let fan1On = false;
  let fan2On = false;
  let muted  = false;
  let client = null;
  let logEntries = [];

  // ========== DOM ==========
  const statusDot     = document.getElementById('statusDot');
  const statusText    = document.getElementById('statusText');
  const tempValue     = document.getElementById('tempValue');
  const humiValue     = document.getElementById('humiValue');
  const lightValue    = document.getElementById('lightValue');
  const lightLux      = document.getElementById('lightLux');
  const presenceValue = document.getElementById('presenceValue');
  const fan1Switch    = document.getElementById('fan1Switch');
  const fan2Switch    = document.getElementById('fan2Switch');
  const muteSwitch    = document.getElementById('muteSwitch');
  const muteStatusTxt = document.getElementById('muteStatusText');
  const fan1StatusTxt = document.getElementById('fan1StatusText');
  const fan2StatusTxt = document.getElementById('fan2StatusText');
  const logList       = document.getElementById('logList');

  // ========== 连接巴法云 ==========
  function connect() {
    client = mqtt.connect(BROKER_URL, {
      clientId: BEMFA_KEY,
      clean: true,
      reconnectPeriod: 3000,
    });

    client.on('connect', () => {
      statusDot.classList.add('online');
      statusText.textContent = '已连接';
      client.subscribe(TOPIC_TEMP);
      client.subscribe(TOPIC_DATA);
      client.subscribe(TOPIC_FAN1);
      client.subscribe(TOPIC_FAN2);
      client.subscribe(TOPIC_MUTE);
      addLog('系统', '巴法云连接成功');
      console.log('Bemfa connected');
    });

    client.on('message', (topic, payload) => {
      const msg = payload.toString();
      console.log('Recv:', topic, msg);

      if (topic === TOPIC_TEMP) {
        // #温度#湿度
        const parts = msg.split('#').filter(Boolean);
        if (parts.length >= 2) {
          tempValue.textContent = parts[0];
          humiValue.textContent = parts[1];
          addLog('数据', `${parts[0]}°C / ${parts[1]}%`);
        }
      } else if (topic === TOPIC_DATA) {
        // #光照百分比#lux#风扇1状态#风扇2状态#人体存在
        const parts = msg.split('#').filter(Boolean);
        if (parts.length >= 1) lightValue.textContent = parts[0];
        if (parts.length >= 2) lightLux.textContent = parts[1];
        if (parts.length >= 3) {
          fan1On = (parts[2] === 'on');
          updateFan1UI();
        }
        if (parts.length >= 4) {
          fan2On = (parts[3] === 'on');
          updateFan2UI();
        }
        if (parts.length >= 5) {
          const present = (parts[4] === 'on');
          presenceValue.textContent = present ? '有人' : '无人';
          presenceValue.style.color = present ? '#22c55e' : '#ef4444';
        }
        addLog('数据', `光照:${parts[0] || '--'}% / ${parts[1] || '--'}lx / 风扇:${parts[2] || '--'} / 加湿器:${parts[3] || '--'} / 人体:${parts[4] === 'on' ? '有人' : '无人'}`);
      } else if (topic === TOPIC_MUTE) {
        muted = (msg === 'off');
        updateMuteUI();
        addLog('控制', `蜂鸣器 -> ${muted ? '关闭' : '开启'}`);
      }
    });

    client.on('close', () => {
      statusDot.classList.remove('online');
      statusText.textContent = '已断开，重连中...';
    });

    client.on('error', (err) => {
      console.error('MQTT error:', err);
      addLog('错误', err.message || String(err));
    });
  }

  // ========== 风扇控制 ==========
  function toggleFan(num) {
    if (num === 1) {
      fan1On = !fan1On;
      updateFan1UI();
      if (client && client.connected) {
        client.publish(TOPIC_FAN1, fan1On ? 'on' : 'off');
        addLog('控制', `风扇 -> ${fan1On ? '开启' : '关闭'}`);
      }
    } else {
      fan2On = !fan2On;
      updateFan2UI();
      if (client && client.connected) {
        client.publish(TOPIC_FAN2, fan2On ? 'on' : 'off');
        addLog('控制', `加湿器 -> ${fan2On ? '开启' : '关闭'}`);
      }
    }
  }

  function updateFan1UI() {
    if (fan1On) {
      fan1Switch.classList.add('on');
      fan1StatusTxt.textContent = '当前状态：运行中';
    } else {
      fan1Switch.classList.remove('on');
      fan1StatusTxt.textContent = '当前状态：关闭';
    }
  }

  function updateFan2UI() {
    if (fan2On) {
      fan2Switch.classList.add('on');
      fan2StatusTxt.textContent = '当前状态：运行中';
    } else {
      fan2Switch.classList.remove('on');
      fan2StatusTxt.textContent = '当前状态：关闭';
    }
  }

  function toggleMute() {
    muted = !muted;
    updateMuteUI();
    if (client && client.connected) {
      client.publish(TOPIC_MUTE, muted ? 'off' : 'on');
      addLog('控制', `蜂鸣器 -> ${muted ? '关闭' : '开启'}`);
    }
  }

  function updateMuteUI() {
    if (muted) {
      muteSwitch.classList.remove('on');
      muteStatusTxt.textContent = '当前状态：关闭';
    } else {
      muteSwitch.classList.add('on');
      muteStatusTxt.textContent = '当前状态：开启';
    }
  }

  // ========== 日志 ==========
  function addLog(tag, msg) {
    const now = new Date();
    const timeStr = now.toTimeString().slice(0, 8);
    logEntries.unshift({ time: timeStr, tag, msg });
    if (logEntries.length > 50) logEntries.pop();
    renderLog();
  }

  function renderLog() {
    logList.innerHTML = logEntries.map(e =>
      `<div class="log-entry"><span class="log-time">[${e.time}]</span> [${e.tag}] ${e.msg}</div>`
    ).join('');
  }

  // ========== 时间显示 ==========
  const weekDays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const timeDisplay = document.getElementById('timeDisplay');

  function updateTime() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    const wd = weekDays[now.getDay()];
    timeDisplay.textContent = `${y}-${m}-${d}  ${hh}:${mm}:${ss}  ${wd}`;
  }
  updateTime();
  setInterval(updateTime, 1000);

  // ========== 启动 ==========
  connect();
</script>
</body>
</html>
