<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能温控 - 手机版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px 16px;
      color: #fff;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header h1 { font-size: 24px; font-weight: 600; }
    .status-dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 6px;
      transition: background 0.3s;
    }
    .status-dot.online { background: #22c55e; }
    .status-text { font-size: 13px; opacity: 0.8; margin-top: 6px; }

    .card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 28px 24px;
      margin-bottom: 20px;
      text-align: center;
    }
    .card-icon { font-size: 40px; margin-bottom: 10px; }
    .card-label { font-size: 14px; opacity: 0.8; margin-bottom: 8px; }
    .card-value { font-size: 48px; font-weight: 700; }
    .card-unit  { font-size: 18px; font-weight: 400; opacity: 0.7; }

    .fan-card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
    }
    .fan-label { font-size: 16px; margin-bottom: 16px; }
    .fan-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .fan-btn.on  { background: #22c55e; color: #fff; }
    .fan-btn.off { background: rgba(255,255,255,0.2); color: #fff; }
    .fan-btn:active { transform: scale(0.96); }

    .footer {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      opacity: 0.5;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>智能温控系统</h1>
  <div id="timeDisplay" style="font-size:14px; opacity:0.8; margin:6px 0;"></div>
  <div class="status-text">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">未连接</span>
  </div>
</div>

<div class="card">
  <div class="card-icon">🌡️</div>
  <div class="card-label">温度</div>
  <div class="card-value"><span id="tempValue">--</span><span class="card-unit">°C</span></div>
</div>

<div class="card">
  <div class="card-icon">💧</div>
  <div class="card-label">湿度</div>
  <div class="card-value"><span id="humiValue">--</span><span class="card-unit">%</span></div>
</div>

<div class="card">
  <div class="card-icon">💡</div>
  <div class="card-label">光照强度</div>
  <div class="card-value"><span id="lightValue">--</span><span class="card-unit">%</span></div>
  <div style="font-size:14px; opacity:0.7; margin-top:6px;"><span id="lightLux">--</span> lx</div>
</div>

<div class="fan-card">
  <div class="fan-label">💨 风扇</div>
  <button class="fan-btn off" id="fan1Btn" onclick="toggleFan(1)">开启风扇</button>
</div>

<div class="fan-card" style="margin-top: 16px;">
  <div class="fan-label">💧 加湿器</div>
  <button class="fan-btn off" id="fan2Btn" onclick="toggleFan(2)">开启加湿器</button>
</div>

<div class="footer">数据每 5 秒自动刷新</div>

<!-- MQTT.js CDN -->
<script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
<script>
  // ========== 巴法云配置 ==========
  const BROKER_URL = 'wss://bemfa.com:9504/wss';
  const BEMFA_KEY  = 'ff2aba976550475080b2c399fad134a0';
  const TOPIC_TEMP = 'temp004';   // 温湿度（小爱查询）
  const TOPIC_DATA = 'data004';   // 光照+风扇状态
  const TOPIC_FAN1 = 'fan003';
  const TOPIC_FAN2 = 'light003';

  // ========== 状态 ==========
  let fan1On = false;
  let fan2On = false;
  let client = null;

  // ========== DOM ==========
  const statusDot  = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const tempValue  = document.getElementById('tempValue');
  const humiValue  = document.getElementById('humiValue');
  const lightValue = document.getElementById('lightValue');
  const lightLux   = document.getElementById('lightLux');
  const fan1Btn    = document.getElementById('fan1Btn');
  const fan2Btn    = document.getElementById('fan2Btn');

  // ========== 连接巴法云 ==========
  function connect() {
    client = mqtt.connect(BROKER_URL, {
      clientId: BEMFA_KEY,
      clean: true,
      reconnectPeriod: 3000,
    });

    client.on('connect', () => {
      statusDot.classList.add('online');
      statusText.textContent = '已连接';
      client.subscribe(TOPIC_TEMP);
      client.subscribe(TOPIC_DATA);
      client.subscribe(TOPIC_FAN1);
      client.subscribe(TOPIC_FAN2);
      console.log('Bemfa connected');
    });

    client.on('message', (topic, payload) => {
      const msg = payload.toString();
      console.log('Recv:', topic, msg);

      if (topic === TOPIC_TEMP) {
        // #温度#湿度
        const parts = msg.split('#').filter(Boolean);
        if (parts.length >= 2) {
          tempValue.textContent = parts[0];
          humiValue.textContent = parts[1];
        }
      } else if (topic === TOPIC_DATA) {
        // #光照百分比#lux#风扇1状态#风扇2状态
        const parts = msg.split('#').filter(Boolean);
        if (parts.length >= 1) lightValue.textContent = parts[0];
        if (parts.length >= 2) lightLux.textContent = parts[1];
        if (parts.length >= 3) {
          fan1On = (parts[2] === 'on');
          updateFan1Btn();
        }
        if (parts.length >= 4) {
          fan2On = (parts[3] === 'on');
          updateFan2Btn();
        }
      }
    });

    client.on('close', () => {
      statusDot.classList.remove('online');
      statusText.textContent = '已断开，重连中...';
    });

    client.on('error', (err) => {
      console.error('MQTT error:', err);
    });
  }

  // ========== 风扇控制 ==========
  function toggleFan(num) {
    if (num === 1) {
      fan1On = !fan1On;
      updateFan1Btn();
      if (client && client.connected) {
        client.publish(TOPIC_FAN1, fan1On ? 'on' : 'off');
        console.log('Fan1 ->', fan1On ? 'on' : 'off');
      }
    } else {
      fan2On = !fan2On;
      updateFan2Btn();
      if (client && client.connected) {
        client.publish(TOPIC_FAN2, fan2On ? 'on' : 'off');
        console.log('Fan2 ->', fan2On ? 'on' : 'off');
      }
    }
  }

  function updateFan1Btn() {
    if (fan1On) {
      fan1Btn.className = 'fan-btn on';
      fan1Btn.textContent = '关闭风扇';
    } else {
      fan1Btn.className = 'fan-btn off';
      fan1Btn.textContent = '开启风扇';
    }
  }

  function updateFan2Btn() {
    if (fan2On) {
      fan2Btn.className = 'fan-btn on';
      fan2Btn.textContent = '关闭加湿器';
    } else {
      fan2Btn.className = 'fan-btn off';
      fan2Btn.textContent = '开启加湿器';
    }
  }

  // ========== 时间显示 ==========
  const weekDays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const timeDisplay = document.getElementById('timeDisplay');

  function updateTime() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    const wd = weekDays[now.getDay()];
    timeDisplay.textContent = `${y}-${m}-${d}  ${hh}:${mm}:${ss}  ${wd}`;
  }
  updateTime();
  setInterval(updateTime, 1000);

  // ========== 启动 ==========
  connect();
</script>
</body>
</html>
